name: Build maturity matrix

on:
  push:
    branches:
      - maturity-matrix-2026-10-13
    paths:
      - 'statistics/scripts/build_maturity_matrix.py'
      - '.github/workflows/build-maturity-matrix.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maturity-matrix-2026-10-13
          fetch-depth: 1
          sparse-checkout: |
            tables
            statistics
          sparse-checkout-cone-mode: true
      - name: Build maturity matrix
        run: python3 statistics/scripts/build_maturity_matrix.py --root .
      - name: Commit generated outputs
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statistics/maturity-matrix.json statistics/maturity-matrix.md statistics/maturity-month-term-publication-matrix.csv statistics/maturity-month-publication-matrix.csv statistics/maturity-year-publication-matrix.csv statistics/maturity-term-publication-matrix.csv
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m '生成到期时间与公示时间矩阵'
          git pull --rebase origin maturity-matrix-2026-10-13
          git push origin HEAD:maturity-matrix-2026-10-13
