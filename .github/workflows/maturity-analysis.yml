name: Build maturity analysis

on:
  push:
    branches:
      - maturity-analysis-2026-10-13
    paths:
      - 'statistics/scripts/analyze_maturity.py'
      - '.github/workflows/maturity-analysis.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'statistics/scripts/analyze_maturity.py'
      - '.github/workflows/maturity-analysis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maturity-analysis-2026-10-13
          fetch-depth: 0
      - name: Build maturity statistics
        run: python3 statistics/scripts/analyze_maturity.py --root .
      - name: Commit generated outputs
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statistics/maturity-analysis.json statistics/maturity-analysis.csv statistics/maturity-analysis.md statistics/maturity-by-start-year.csv
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m '生成借款到期时间统计'
          git push origin HEAD:maturity-analysis-2026-10-13
